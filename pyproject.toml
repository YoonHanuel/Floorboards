[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hanuel-floorboards"
version = "0.1.0"
description = "A tiny cabinet of falsifiable software assumptions."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yoon Hanuel" }]
dependencies = []

[project.scripts]
floorboards = "floorboards.__main__:main"

[tool.setuptools.packages.find]
include = ["floorboards*"]
